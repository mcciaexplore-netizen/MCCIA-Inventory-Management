services:
  - type: web
    name: mccia-inventory
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/offices
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL      # Neon connection string; set it in the Render dashboard
        sync: false
      - key: SMTP_HOST         # email for POs and low-stock alerts
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM         # e.g. "MCCIA Inventory <inventory@yourdomain>"
        sync: false
      - key: ALERT_EMAIL       # optional, comma-separated; defaults to admin/manager logins
        sync: false
