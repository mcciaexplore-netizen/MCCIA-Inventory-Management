# Render's free plan sleeps after ~15 min idle, which makes the first request take ~50s.
# Ping the API every 10 minutes (office hours, UTC) to keep it awake.
name: keep-warm
on:
  schedule:
    - cron: '*/10 3-14 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 90 https://mccia-inventory-management.onrender.com/api/offices
